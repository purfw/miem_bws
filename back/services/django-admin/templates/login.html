<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ConfHub Admin</title>
<style>body{font:16px system-ui;background:#f4f6fb;color:#172033;margin:0;display:grid;place-items:center;min-height:100vh}.card{background:#fff;padding:32px;border-radius:16px;box-shadow:0 16px 45px #18234a20;width:min(360px,calc(100% - 48px))}h1{margin-top:0}label{display:grid;gap:6px;margin:16px 0}input,button{font:inherit;padding:11px;border:1px solid #b8c1d9;border-radius:8px}button{background:#3156d3;color:white;border:0;width:100%;cursor:pointer}.error{color:#a41423}</style></head><body><main class="card"><h1>Администрирование</h1><p>Доступ разрешён только через защищённый SSH-туннель. Введите пароль и код TOTP.</p>{% if activated %}<p role="status">Учётная запись создана. Войдите с новым паролем и кодом из своего приложения-аутентификатора.</p>{% endif %}{% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}<form method="post">{% csrf_token %}<label>Логин<input name="username" autocomplete="username" required></label><label>Пароль<input type="password" name="password" autocomplete="current-password" required></label><label>Одноразовый код<input name="otp" inputmode="numeric" pattern="[0-9]{6}" autocomplete="one-time-code" required></label><button>Войти</button></form></main></body></html>
