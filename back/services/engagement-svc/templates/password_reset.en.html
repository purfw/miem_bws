<!doctype html>
<html lang="en"><body style="font-family:Arial,sans-serif;line-height:1.5">
<h2>Reset password</h2>
<p>Hello, {{.UserName}}!</p>
<p>Someone requested a password reset for your account.</p>
<p>Set a new password using this link:</p>
<p><a href="{{.ResetURL}}">{{.ResetURL}}</a></p>
<p>The link is valid for one hour. If you did not request it, you can ignore this message.</p>
</body></html>
