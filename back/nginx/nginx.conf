worker_processes auto;
events { worker_connections 1024; }

http {
    log_format confhub_safe escape=json '{"time":"$time_iso8601","client":"$remote_addr","method":"$request_method","path":"$uri","status":$status,"duration":$request_time}';
    access_log /var/log/nginx/access.log confhub_safe;
    limit_req_status 429;
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    server_tokens off;
    client_max_body_size 25m;

    limit_req_zone $binary_remote_addr zone=anon:10m rate=30r/m;
    map $request_method $api_write_key {
        default $binary_remote_addr;
        GET "";
        HEAD "";
        OPTIONS "";
    }
    map $request_method $api_read_key {
        default "";
        GET $binary_remote_addr;
        HEAD $binary_remote_addr;
        OPTIONS $binary_remote_addr;
    }
    limit_req_zone $api_write_key zone=api_write:10m rate=100r/m;
    limit_req_zone $api_read_key zone=api_read:10m rate=300r/m;

    resolver 127.0.0.11 valid=10s ipv6=off;

    map $http_x_request_id $req_id {
        default   $http_x_request_id;
        ""        $request_id;
    }

    server {
        listen 80;
        server_name _;

        absolute_redirect off;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        include /etc/nginx/api.conf;

        location / {
            return 404 'frontend not deployed yet\n';
            add_header Content-Type text/plain;
        }
    }
}
