worker_processes auto;
events { worker_connections 1024; }

http {
    log_format confhub_safe escape=json '{"time":"$time_iso8601","client":"$remote_addr","method":"$request_method","path":"$uri","status":$status,"duration":$request_time}';
    access_log /var/log/nginx/access.log confhub_safe;
    limit_req_status 429;
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    server_tokens off;
    client_max_body_size 25m;

    limit_req_zone $binary_remote_addr zone=anon:10m rate=30r/m;
    map $request_method $api_write_key {
        default $binary_remote_addr;
        GET "";
        HEAD "";
        OPTIONS "";
    }
    map $request_method $api_read_key {
        default "";
        GET $binary_remote_addr;
        HEAD $binary_remote_addr;
        OPTIONS $binary_remote_addr;
    }
    limit_req_zone $api_write_key zone=api_write:10m rate=100r/m;
    limit_req_zone $api_read_key zone=api_read:10m rate=300r/m;
    limit_req_zone $binary_remote_addr zone=search:10m rate=200r/m;

    resolver 127.0.0.11 valid=10s ipv6=off;

    upstream identity {
        zone identity_zone 64k;
        server identity-svc:8081 resolve;
    }
    upstream conference {
        zone conference_zone 64k;
        server conference-svc:8082 resolve;
    }
    upstream application {
        zone application_zone 64k;
        server application-svc:8083 resolve;
    }
    upstream engagement {
        zone engagement_zone 64k;
        server engagement-svc:8084 resolve;
    }
    upstream object_store {
        zone object_store_zone 64k;
        server minio:9000 resolve;
    }
    upstream django {
        zone django_zone 64k;
        server django-admin:8000 resolve;
    }
    upstream frontend {
        zone frontend_zone 64k;
        server frontend:8080 resolve;
    }

    map $http_x_request_id $req_id {
        default   $http_x_request_id;
        ""        $request_id;
    }

    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_session_timeout 1d;
        ssl_session_cache shared:SSL:10m;
        ssl_protocols TLSv1.3;
        ssl_prefer_server_ciphers off;

        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        location = /api/v1/openapi/identity.json {
            limit_req zone=anon burst=10 nodelay;
            proxy_pass http://identity/openapi.json;
            proxy_set_header X-Request-ID $req_id;
        }

        location = /api/v1/openapi/conference.json {
            limit_req zone=anon burst=10 nodelay;
            proxy_pass http://conference/openapi.json;
            proxy_set_header X-Request-ID $req_id;
        }

        location = /api/v1/openapi/application.json {
            limit_req zone=anon burst=10 nodelay;
            proxy_pass http://application/openapi.json;
            proxy_set_header X-Request-ID $req_id;
        }

        location = /api/v1/openapi/engagement.json {
            limit_req zone=anon burst=10 nodelay;
            proxy_pass http://engagement/openapi.json;
            proxy_set_header X-Request-ID $req_id;
        }

        location /api/v1/auth/ {
            limit_req zone=anon burst=10 nodelay;
            proxy_pass http://identity;
            proxy_set_header X-Request-ID $req_id;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 10s;
        }

        location ~ ^/api/v1/conferences/[^/]+/applications {
            limit_req zone=api_write burst=40 nodelay;
            limit_req zone=api_read burst=40 nodelay;
            proxy_pass http://application;
            proxy_set_header X-Request-ID $req_id;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-User-Email "";
            proxy_set_header X-User-Name "";
            proxy_read_timeout 30s;
        }

        location ~ ^/api/v1/conferences/[^/]+/participants {
            limit_req zone=api_write burst=40 nodelay;
            limit_req zone=api_read burst=40 nodelay;
            proxy_pass http://application;
            proxy_set_header X-Request-ID $req_id;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-User-Email "";
            proxy_set_header X-User-Name "";
            proxy_read_timeout 10s;
        }

        location = /api/v1/conferences {
            limit_req zone=api_write burst=40 nodelay;
            limit_req zone=api_read burst=40 nodelay;
            proxy_pass http://conference;
            proxy_set_header X-Request-ID $req_id;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 5s;
        }

        location /api/v1/conferences/ {
            limit_req zone=api_write burst=40 nodelay;
            limit_req zone=api_read burst=40 nodelay;
            proxy_pass http://conference;
            proxy_set_header X-Request-ID $req_id;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 5s;
        }

        location /api/v1/home {
            limit_req zone=api_write burst=40 nodelay;
            limit_req zone=api_read burst=40 nodelay;
            proxy_pass http://conference;
            proxy_set_header X-Request-ID $req_id;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 5s;
        }

        location /api/v1/search {
            limit_req zone=search burst=40 nodelay;
            proxy_pass http://conference;
            proxy_set_header X-Request-ID $req_id;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 5s;
        }

        location /api/v1/favorites {
            limit_req zone=api_write burst=40 nodelay;
            limit_req zone=api_read burst=40 nodelay;
            proxy_pass http://conference;
            proxy_set_header X-Request-ID $req_id;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 5s;
        }

        location /api/v1/registrations/ {
            limit_req zone=api_write burst=40 nodelay;
            limit_req zone=api_read burst=40 nodelay;
            proxy_pass http://conference;
            proxy_set_header X-Request-ID $req_id;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 10s;
        }

        location /api/v1/sessions/ {
            limit_req zone=api_write burst=40 nodelay;
            limit_req zone=api_read burst=40 nodelay;
            proxy_pass http://conference;
            proxy_set_header X-Request-ID $req_id;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 10s;
        }

        location /api/v1/my/ {
            limit_req zone=api_write burst=40 nodelay;
            limit_req zone=api_read burst=40 nodelay;
            proxy_pass http://conference;
            proxy_set_header X-Request-ID $req_id;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 10s;
        }

        location /api/v1/support/ {
            limit_req zone=anon burst=3 nodelay;
            proxy_pass http://engagement;
            proxy_set_header X-Request-ID $req_id;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 20s;
        }

        location /api/v1/subscriptions {
            limit_req zone=api_write burst=40 nodelay;
            limit_req zone=api_read burst=40 nodelay;
            proxy_pass http://engagement;
            proxy_set_header X-Request-ID $req_id;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 20s;
        }

        location /api/v1/documents/ {
            limit_req zone=api_write burst=40 nodelay;
            limit_req zone=api_read burst=40 nodelay;
            proxy_pass http://application;
            proxy_set_header X-Request-ID $req_id;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 30s;
        }

        location /api/v1/applications/ {
            limit_req zone=api_write burst=40 nodelay;
            limit_req zone=api_read burst=40 nodelay;
            proxy_pass http://application;
            proxy_set_header X-Request-ID $req_id;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-User-Email "";
            proxy_set_header X-User-Name "";
            proxy_read_timeout 30s;
        }

        location ~ ^/api/v1/(verifications|verification-documents) {
            limit_req zone=api_write burst=10 nodelay;
            limit_req zone=api_read burst=40 nodelay;
            proxy_pass http://application;
            proxy_set_header X-Request-ID $req_id;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 30s;
        }

        location /api/v1/files/ {
            proxy_pass http://application;
            proxy_set_header X-Request-ID $req_id;
            proxy_set_header X-User-Email "";
            proxy_set_header X-User-Name "";
        }

        location /application-files/ {
            proxy_pass http://object_store;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }

        location /internal/ {
            return 404;
        }

        location /admin/ {
            proxy_pass http://django;
            proxy_set_header Host $http_host;
            proxy_set_header X-Request-ID $req_id;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 30s;
        }


        location /healthz/identity    { proxy_pass http://identity/healthz; }
        location /healthz/conference  { proxy_pass http://conference/healthz; }
        location /healthz/application { proxy_pass http://application/healthz; }
        location /healthz/engagement  { proxy_pass http://engagement/healthz; }
        location /healthz/django      { proxy_set_header Host 127.0.0.1; proxy_pass http://django/healthz; }

        location / {
            proxy_pass http://frontend;
            proxy_set_header X-Request-ID $req_id;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
