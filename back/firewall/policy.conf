# Политика межсетевого экрана ConfHub.
#
# Всё, что не разрешено явно, запрещено (default deny). Файл — единственный
# источник правил; scripts/firewall.sh превращает его в набор nftables.
#
#   group  <имя> <сервис> [<сервис> ...]         набор сервисов, в правилах пишется @имя
#   allow  <сегмент> <источник> <получатель> <proto> <порты>
#   egress <источник> <proto> <порты>            выход во внешние сети из сегмента app
#
# Сервисы — имена из docker compose; контейнер другого проекта, подключённый к
# сегменту, указывается именем контейнера. Участник группы, которого нет в текущей
# конфигурации (например, postgres-2 без HA-оверлея), пропускается.

group svc    identity-svc conference-svc application-svc engagement-svc
group pg     postgres postgres-2
group etcd   etcd-1 etcd-2 etcd-3
group nats   nats nats-2 nats-3
group mail   mailpit
group mon    prometheus

# --- edge: входной контур ---------------------------------------------------
allow edge    nginx            frontend         tcp 8080

# --- app: шлюз -> публичные API ---------------------------------------------
allow app     nginx            identity-svc     tcp 8081
allow app     nginx            conference-svc   tcp 8082
allow app     nginx            application-svc  tcp 8083
allow app     nginx            engagement-svc   tcp 8084
allow app     nginx            django-admin     tcp 8000

# --- app: внутренние API между сервисами (mTLS, порт 8443) ------------------
allow app     conference-svc   identity-svc     tcp 8443
allow app     application-svc  identity-svc     tcp 8443
allow app     application-svc  conference-svc   tcp 8443
allow app     engagement-svc   identity-svc     tcp 8443
allow app     engagement-svc   conference-svc   tcp 8443
allow app     django-admin     @svc             tcp 8443

# --- app: трассировка и почта ------------------------------------------------
allow app     @svc             jaeger           tcp 4318
allow app     engagement-svc   @mail            tcp 1025

# --- app: сбор метрик (Prometheus из отдельного проекта monitoring) ---------
allow app     @mon             identity-svc     tcp 8081
allow app     @mon             conference-svc   tcp 8082
allow app     @mon             application-svc  tcp 8083
allow app     @mon             engagement-svc   tcp 8084

# --- data: PostgreSQL --------------------------------------------------------
allow data    @svc             @pg              tcp 5432
allow data    django-admin     @pg              tcp 5432
allow data    @pg              @pg              tcp 5432,8008
allow data    @pg              @etcd            tcp 2379
allow data    @etcd            @etcd            tcp 2380

# --- data: Redis и поиск -----------------------------------------------------
allow data    @svc             redis-state      tcp 6379
allow data    django-admin     redis-state      tcp 6379
allow data    conference-svc   redis            tcp 6379
allow data    conference-svc   elasticsearch    tcp 9200

# --- broker: NATS JetStream --------------------------------------------------
allow broker  @svc             @nats            tcp 4222
allow broker  @nats            @nats            tcp 6222

# --- storage: объектное хранилище --------------------------------------------
allow storage nginx            minio            tcp 9000
allow storage application-svc  minio            tcp 9000

# --- выход во внешние сети ---------------------------------------------------
# DNS нужен для разрешения внешних имён; 443 — ORCID и проверка утёкших
# паролей; 465/587 — внешний SMTP.
egress identity-svc     udp 53
egress identity-svc     tcp 53,443
egress application-svc  udp 53
egress application-svc  tcp 53,443
egress engagement-svc   udp 53
egress engagement-svc   tcp 53,465,587
