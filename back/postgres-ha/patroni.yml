# Имя узла, адреса, etcd и пароли задаются переменными PATRONI_* в
# docker-compose.ha.yml; здесь только общие для всех узлов настройки.
restapi:
  listen: 0.0.0.0:8008

bootstrap:
  dcs:
    # Лидер обязан продлевать ключ в etcd каждые loop_wait секунд. Если ключ не
    # продлён за ttl, standby начинает выборы: это верхняя граница обнаружения отказа.
    ttl: 20
    loop_wait: 5
    retry_timeout: 5
    maximum_lag_on_failover: 1048576
    # Синхронная репликация: подтверждённая транзакция есть на обоих узлах (RPO = 0).
    # Если standby недоступен, Patroni временно отключает требование синхронности.
    synchronous_mode: true
    postgresql:
      use_pg_rewind: true
      parameters:
        wal_level: replica
        hot_standby: "on"
        wal_log_hints: "on"
        max_wal_senders: 10
        max_replication_slots: 10
  initdb:
    - encoding: UTF8
    - data-checksums
  post_bootstrap: /usr/local/bin/confhub-post-bootstrap.sh

postgresql:
  listen: 0.0.0.0:5432
  data_dir: /var/lib/postgresql/data/pgdata
  pg_hba:
    - local all all peer
    - host replication replicator samenet scram-sha-256
    - host all all samenet scram-sha-256
  parameters:
    password_encryption: scram-sha-256
    unix_socket_directories: /var/run/postgresql
