# Logrotate configuration for application logs
# Install: cp docker-logrotate.conf /etc/logrotate.d/confhub

/var/lib/docker/containers/*/*.log {
    daily
    rotate 7
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
    maxsize 100M
}

/project/back/logs/*.log {
    daily
    rotate 14
    compress
    delaycompress
    missingok
    notifempty
    create 0644 root root
    sharedscripts
    postrotate
        docker compose -f /project/back/docker-compose.prod.yml kill -s USR1 2>/dev/null || true
    endscript
}

/project/monitoring/prometheus/*.log {
    daily
    rotate 7
    compress
    delaycompress
    missingok
    notifempty
    create 0644 root root
}

/project/monitoring/loki/*.log {
    daily
    rotate 7
    compress
    delaycompress
    missingok
    notifempty
    create 0644 root root
}
