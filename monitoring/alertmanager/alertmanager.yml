global:
  resolve_timeout: 5m

route:
  group_by: ['alertname', 'severity']
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 12h
  receiver: 'telegram'
  routes:
    - matchers:
        - severity = "critical"
      receiver: 'telegram'
      group_wait: 0s
      repeat_interval: 1h

    - matchers:
        - severity = "warning"
      receiver: 'telegram'
      group_wait: 30s
      repeat_interval: 4h

receivers:
  - name: 'telegram'
    webhook_configs:
      - url: 'http://alert-bot:8080/alerts'
        send_resolved: true

inhibit_rules:
  - equal: ['alertname', 'instance']
    source_matchers:
      - severity = "critical"
    target_matchers:
      - severity = "warning"
