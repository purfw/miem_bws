groups:
  - name: container_alerts
    interval: 30s
    rules:
      # cAdvisor runs with --store_container_labels=false, so containers are
      # identified by the `name` label (the Docker container name).
      # A stopped container disappears from cAdvisor output; max_over_time keeps
      # its last sample for an hour, and `max by (name)` merges the series of a
      # recreated container with the same name so redeploys do not fire.
      # Only long-running production containers: the lab project and one-off
      # `compose run` containers are removed on purpose.
      - alert: ContainerDown
        expr: |
          time() - max by (name) (
            max_over_time(container_last_seen{name=~"confhub-.+", name!~"confhub-lab-.+|.+-run-.+"}[1h])
          ) > 60
        for: 1m
        labels:
          severity: critical
          component: container
        annotations:
          summary: "Container {{ $labels.name }} is down"
          description: "Container {{ $labels.name }} has not been seen by cAdvisor for more than 2 minutes"

      - alert: HighCPUUsage
        expr: |
          sum by (name) (rate(container_cpu_usage_seconds_total{name!=""}[5m])) * 100 > 80
        for: 5m
        labels:
          severity: warning
          component: container
        annotations:
          summary: "High CPU usage on {{ $labels.name }}"
          description: "Container {{ $labels.name }} CPU usage is above 80% of one core for 5 minutes"

      - alert: HighMemoryUsage
        # Only containers with a memory limit: without one the limit is 0.
        expr: |
          max by (name) (
            container_memory_working_set_bytes{name!=""}
              / (container_spec_memory_limit_bytes{name!=""} > 0)
          ) * 100 > 80
        for: 5m
        labels:
          severity: warning
          component: container
        annotations:
          summary: "High memory usage on {{ $labels.name }}"
          description: "Container {{ $labels.name }} memory usage is above 80% of its limit"

      # cAdvisor has no restart counter; a restart changes the start time of the
      # same container.
      - alert: ContainerRestartLoop
        expr: |
          max by (name) (changes(container_start_time_seconds{name!=""}[1h])) > 3
        for: 1m
        labels:
          severity: critical
          component: container
        annotations:
          summary: "Container {{ $labels.name }} is restarting frequently"
          description: "Container {{ $labels.name }} has restarted {{ $value }} times in the last hour"

  - name: system_alerts
    interval: 30s
    rules:
      - alert: HighSystemCPU
        expr: |
          100 - (avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 80
        for: 5m
        labels:
          severity: warning
          component: system
        annotations:
          summary: "High CPU usage on {{ $labels.instance }}"
          description: "System CPU usage is above 80% for 5 minutes"

      - alert: HighDiskUsage
        expr: |
          (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) * 100 < 20
        for: 5m
        labels:
          severity: warning
          component: disk
        annotations:
          summary: "Low disk space on {{ $labels.instance }}"
          description: "Disk space is below 20% on {{ $labels.instance }}"

      - alert: DiskAlmostFull
        expr: |
          (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) * 100 < 10
        for: 1m
        labels:
          severity: critical
          component: disk
        annotations:
          summary: "Disk almost full on {{ $labels.instance }}"
          description: "Disk space is below 10% on {{ $labels.instance }} - immediate action required!"

      - alert: HighSystemMemory
        expr: |
          (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 85
        for: 5m
        labels:
          severity: warning
          component: memory
        annotations:
          summary: "High memory usage on {{ $labels.instance }}"
          description: "System memory usage is above 85% for 5 minutes"

  - name: service_alerts
    interval: 30s
    rules:
      - alert: TargetDown
        expr: up == 0
        for: 2m
        labels:
          severity: critical
          component: service
        annotations:
          summary: "Service {{ $labels.job }} is down"
          description: "Service {{ $labels.job }} has been down for 2 minutes"

      - alert: HighRequestLatency
        expr: |
          histogram_quantile(0.95, sum by (job, le) (rate(http_request_duration_seconds_bucket[5m]))) > 5
        for: 5m
        labels:
          severity: warning
          component: service
        annotations:
          summary: "High request latency on {{ $labels.job }}"
          description: "95th percentile request latency is above 5 seconds"

  - name: application_queues
    rules:
      - alert: QueueCollectionFailed
        expr: confhub_queue_collection_success == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Queue metrics unavailable on {{ $labels.service }}"
      - alert: QueueItemParked
        expr: confhub_queue_items{status=~"dead|failed"} > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.queue }} contains failed items on {{ $labels.service }}"
      - alert: QueueDeliveryStalled
        expr: confhub_queue_oldest_age_seconds{status=~"pending|sending"} > 600
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.queue }} has not drained on {{ $labels.service }}"

  - name: loki_alerts
    interval: 60s
    rules:
      - alert: LokiNotIngesting
        expr: |
          rate(loki_ingester_lines_total[5m]) == 0
        for: 5m
        labels:
          severity: warning
          component: logging
        annotations:
          summary: "Loki is not ingesting logs"
          description: "Loki has not ingested any logs for 5 minutes"

      - alert: LokiDroppedEntries
        expr: |
          sum(rate(loki_ingester_dropped_entries_total[5m])) > 0
        for: 1m
        labels:
          severity: critical
          component: logging
        annotations:
          summary: "Loki is dropping log entries"
          description: "Loki is dropping {{ $value }} entries per second"
