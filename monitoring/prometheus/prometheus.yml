global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'production'
    environment: 'docker'

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

rule_files:
  - '/etc/prometheus/rules/*.yml'
  - '/etc/prometheus/alerts.yml'

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']

  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']
    metrics_path: '/metrics'

  - job_name: 'loki'
    static_configs:
      - targets: ['loki:3100']
    metrics_path: '/metrics'

  - job_name: 'identity-svc'
    static_configs:
      - targets: ['identity-svc:8081']
  - job_name: 'conference-svc'
    static_configs:
      - targets: ['conference-svc:8082']
  - job_name: 'application-svc'
    static_configs:
      - targets: ['application-svc:8083']
  - job_name: 'engagement-svc'
    static_configs:
      - targets: ['engagement-svc:8084']
