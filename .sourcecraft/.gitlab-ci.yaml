stages:
  - security_scan

dast:
  stage: security_scan
  image: alpine:3.21
  services:
    - name: docker:29-dind
      command: ["--tls=false"]
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  before_script:
    - apk add --no-cache docker-cli docker-cli-compose curl openssl nikto
  script:
    - cd back
    - export DAST_PROJECT="confhub_dast_${CI_JOB_ID:-ci}"
    - mkdir -p ../reports/security/dast secrets
    - test ! -f .env
    - umask 077
    - openssl genpkey -algorithm Ed25519 -out secrets/jwt_ed25519.key
    - openssl pkey -in secrets/jwt_ed25519.key -pubout -out secrets/jwt_ed25519.pub
    - chmod 644 secrets/jwt_ed25519.key secrets/jwt_ed25519.pub
    - |
      {
        printf 'POSTGRES_PASSWORD=%s\n' "$(openssl rand -hex 24)"
        printf 'SVC_DB_PASSWORD=%s\n' "$(openssl rand -hex 24)"
        printf 'SERVICE_TOKEN_SECRET=%s\n' "$(openssl rand -hex 32)"
        printf 'JOIN_URL_ENCRYPTION_KEY=%s\n' "$(openssl rand -base64 32)"
        printf 'DJANGO_SECRET_KEY=%s\n' "$(openssl rand -hex 32)"
        printf 'MINIO_ROOT_USER=confhub-dast\n'
        printf 'MINIO_ROOT_PASSWORD=%s\n' "$(openssl rand -hex 24)"
      } > .env
    - docker build -t confhub-dast-admin services/django-admin
    - |
      docker run --rm --user 0:0 --entrypoint python \
        -v "$PWD/secrets:/setup" confhub-dast-admin -c '
      import secrets, uuid, pyotp
      from pathlib import Path
      from console.credentials import AdminPasswordHasher, Credentials, save_credentials
      hasher = AdminPasswordHasher()
      value = Credentials("dast-admin", hasher.encode(secrets.token_urlsafe(32), hasher.salt()), pyotp.random_base32(), str(uuid.uuid4()), str(uuid.uuid4()))
      save_credentials(Path("/setup/admin-auth"), value)
      '
    - docker compose -p "$DAST_PROJECT" -f docker-compose.yml -f docker-compose.local.yml up -d --build --wait --wait-timeout 240
    - |
      for target in identity-svc:8081 conference-svc:8082 application-svc:8083 engagement-svc:8084; do
        service=${target%:*}
        port=${target#*:}
        ready=false
        for attempt in $(seq 1 30); do
          if docker compose -p "$DAST_PROJECT" -f docker-compose.yml -f docker-compose.local.yml exec -T "$service" wget -qO- "http://127.0.0.1:$port/readyz"; then
            ready=true
            break
          fi
          sleep 2
        done
        test "$ready" = true
      done
    - curl --fail --retry 5 --retry-delay 2 http://docker:8080/api/v1/conferences
    - nikto -h http://docker:8080 -o ../reports/security/dast/nikto.xml -Format xml -T 1-8
  after_script:
    - cd back
    - export DAST_PROJECT="confhub_dast_${CI_JOB_ID:-ci}"
    - docker compose -p "$DAST_PROJECT" -f docker-compose.yml -f docker-compose.local.yml down -v --remove-orphans
  artifacts:
    when: always
    paths:
      - reports/security/dast/
  allow_failure: false
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "master"'
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
