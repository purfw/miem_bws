stages:
  - security_scan

dast:
  stage: security_scan
  image: alpine:3.21
  services:
    - name: docker:29-dind
      command: ["--tls=false"]
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  before_script:
    - apk add --no-cache bash docker-cli docker-cli-compose curl openssl nikto
  script:
    - cd back
    - export DAST_PROJECT="confhub_dast_${CI_JOB_ID:-ci}"
    # The production stack, built from source, with the loopback gateway on :8080.
    - export DAST_COMPOSE="-f docker-compose.prod.yml -f docker-compose.build.yml -f docker-compose.local.yml"
    - mkdir -p ../reports/security/dast secrets/certs
    - test ! -f .env
    - umask 077
    - openssl genpkey -algorithm Ed25519 -out secrets/jwt_ed25519.key
    - openssl pkey -in secrets/jwt_ed25519.key -pubout -out secrets/jwt_ed25519.pub
    # Services read the private key through group 0 (group_add in compose), as in deploy.sh.
    - chgrp 0 secrets/jwt_ed25519.key
    - chmod 640 secrets/jwt_ed25519.key
    - chmod 644 secrets/jwt_ed25519.pub
    - bash scripts/mtls.sh
    - |
      {
        printf 'POSTGRES_PASSWORD=%s\n' "$(openssl rand -hex 24)"
        printf 'SVC_DB_PASSWORD=%s\n' "$(openssl rand -hex 24)"
        printf 'SERVICE_TOKEN_SECRET=%s\n' "$(openssl rand -hex 32)"
        printf 'JOIN_URL_ENCRYPTION_KEY=%s\n' "$(openssl rand -base64 32)"
        printf 'DJANGO_SECRET_KEY=%s\n' "$(openssl rand -hex 32)"
        printf 'MINIO_ROOT_USER=confhub-dast\n'
        printf 'MINIO_ROOT_PASSWORD=%s\n' "$(openssl rand -hex 24)"
        printf 'POSTGRES_DB=confhub\nPOSTGRES_USER=postgres\n'
        printf 'MINIO_BUCKET=application-files\nMAX_FILE_SIZE_BYTES=20971520\n'
        printf 'JWT_ISSUER=confhub\nACCESS_TOKEN_TTL=15m\nREFRESH_TOKEN_TTL=168h\n'
        printf 'JWT_PRIVATE_KEY_FILE=./secrets/jwt_ed25519.key\nJWT_PUBLIC_KEY_FILE=./secrets/jwt_ed25519.pub\n'
        printf 'TLS_CERTS_DIR=./secrets/certs\nBASE_URL=http://docker:8080\n'
        printf 'SMTP_HOST=mailpit\nSMTP_PORT=1025\nSMTP_FROM=noreply@confhub.example.com\n'
        printf 'SUPPORT_EMAIL=support@confhub.example.com\nALLOWED_HOSTS=docker,localhost,127.0.0.1\n'
        printf 'CI_REGISTRY_IMAGE=confhub-dast\nIMAGE_TAG=ci\n'
      } > .env
    - docker compose -p "$DAST_PROJECT" $DAST_COMPOSE config -q
    # Jaeger runs as uid 10001 and needs a writable trace volume (as in lab.sh).
    - docker volume create "${DAST_PROJECT}_jaegerdata"
    - docker run --rm --network none -v "${DAST_PROJECT}_jaegerdata:/traces" alpine:3.21 chown 10001:10001 /traces
    - docker build -t confhub-dast-admin services/django-admin
    - |
      docker run --rm --user 0:0 --entrypoint python \
        -v "$PWD/secrets:/setup" confhub-dast-admin -c '
      import secrets, uuid, pyotp
      from pathlib import Path
      from console.credentials import AdminPasswordHasher, Credentials, save_credentials
      hasher = AdminPasswordHasher()
      value = Credentials("dast-admin", hasher.encode(secrets.token_urlsafe(32), hasher.salt()), pyotp.random_base32(), str(uuid.uuid4()), str(uuid.uuid4()))
      save_credentials(Path("/setup/admin-auth"), value)
      '
    - docker compose -p "$DAST_PROJECT" $DAST_COMPOSE up -d --build --wait --wait-timeout 240
    - |
      for target in identity-svc:8081 conference-svc:8082 application-svc:8083 engagement-svc:8084; do
        service=${target%:*}
        port=${target#*:}
        ready=false
        for attempt in $(seq 1 30); do
          if docker compose -p "$DAST_PROJECT" $DAST_COMPOSE exec -T "$service" wget -qO- "http://127.0.0.1:$port/readyz"; then
            ready=true
            break
          fi
          sleep 2
        done
        test "$ready" = true
      done
    - curl --fail --retry 5 --retry-delay 2 http://docker:8080/api/v1/conferences
    - nikto -h http://docker:8080 -o ../reports/security/dast/nikto.xml -Format xml -T 1-8
  after_script:
    - cd back
    - export DAST_PROJECT="confhub_dast_${CI_JOB_ID:-ci}"
    - export DAST_COMPOSE="-f docker-compose.prod.yml -f docker-compose.build.yml -f docker-compose.local.yml"
    - docker compose -p "$DAST_PROJECT" $DAST_COMPOSE down -v --remove-orphans
  artifacts:
    when: always
    paths:
      - reports/security/dast/
  allow_failure: false
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "master"'
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
